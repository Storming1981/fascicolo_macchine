# Reverse proxy per machines.zatospa.it -> app in ascolto su 127.0.0.1:3000
# Copiare in /etc/nginx/sites-available/ e collegare in sites-enabled, poi:
#   sudo certbot --nginx -d machines.zatospa.it
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name machines.zatospa.it;
    # certbot inserirà qui il redirect a HTTPS

    # Le API vogliono impostazioni diverse dalle pagine:
    #  - indicizzare un manuale nella Knowledge (estrazione testo + eventuale
    #    OCR delle pagine scansionate) può durare minuti;
    #  - le risposte dello ZATO Brain sono in streaming (SSE): con il buffering
    #    attivo la pagina resta ferma e poi sputa tutto il testo in blocco;
    #  - i video di procedura arrivano fino a 60 MB (limite applicativo).
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 64m;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # upload foto/documenti/firme: il limite app è 25 MB
        client_max_body_size 32m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

