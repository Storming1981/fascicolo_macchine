# Reverse proxy per machines.zatospa.it -> app in ascolto su 127.0.0.1:3000
# Copiare in /etc/nginx/sites-available/ e collegare in sites-enabled, poi:
#   sudo certbot --nginx -d machines.zatospa.it
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name machines.zatospa.it;
    # certbot inserirà qui il redirect a HTTPS
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # upload foto/documenti/firme: il limite app è 25 MB
        client_max_body_size 32m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

